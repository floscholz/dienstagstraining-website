name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEGAL_NAME: "Max Mustermann"
      LEGAL_STREET: "Musterstraße 1"
      LEGAL_CITY: "12345 Musterstadt"
      LEGAL_COUNTRY: "Deutschland"
      LEGAL_EMAIL: "kontakt@example.de"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
